name: Import verified AOSP17 frameworks/base release tree

on:
  push:
    branches:
      - port/a17-frameworks-base-import-20261103
    paths:
      - .github/workflows/aosp17-frameworks-base-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aosp17-frameworks-base-import
  cancel-in-progress: false

jobs:
  import-release-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SOURCE_SHA: 94b4c163b7dfe5ce3607f7bb8456f9573f7de57d
      SOURCE_TREE: 908a2ce43657451526181a33ee94fc688add3117
      TARGET_BRANCH: port/a17-frameworks-base-aosp17-base-20261103
      UPLOAD_BRANCH: port/a17-frameworks-base-upload-staging-20261103
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout import tooling, not the legacy PE code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact official AOSP17 release commit and verify tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/aosp-fwbase"
          cd "$RUNNER_TEMP/aosp-fwbase"
          git init -q
          git remote add aosp https://android.googlesource.com/platform/frameworks/base
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none \
            aosp refs/tags/android-17.0.0_r1
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$SOURCE_TREE"
          git cat-file -e "$SOURCE_TREE^{tree}"
          echo "Verified AOSP17 source commit $SOURCE_SHA / tree $SOURCE_TREE"
      - name: Publish exact tree in resumable small batches
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp-fwbase"
          git remote add publish "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export GIT_AUTHOR_NAME='PixelExperience-Reborn CI'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          python3 "$GITHUB_WORKSPACE/tools/chunked_import_aosp17.py" \
            --repo "$PWD" \
            --remote publish \
            --source "$SOURCE_SHA" \
            --tree "$SOURCE_TREE" \
            --staging-branch "$UPLOAD_BRANCH" \
            --final-branch "$TARGET_BRANCH" \
            --chunk-files 250
      - name: Verify published branch and exact official release tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp-fwbase"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none \
            publish "refs/heads/$TARGET_BRANCH"
          actual="$(git rev-parse 'FETCH_HEAD^{tree}')"
          test "$actual" = "$SOURCE_TREE"
          echo "PASS: published frameworks/base AOSP17 tree $actual"
