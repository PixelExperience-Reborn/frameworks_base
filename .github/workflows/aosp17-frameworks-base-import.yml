name: Import verified AOSP17 frameworks/base release tree

on:
  push:
    branches:
      - port/a17-frameworks-base-import-20261103
    paths:
      - .github/workflows/aosp17-frameworks-base-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aosp17-frameworks-base-import
  cancel-in-progress: false

jobs:
  import-release-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOURCE_SHA: 94b4c163b7dfe5ce3607f7bb8456f9573f7de57d
      SOURCE_TREE: 908a2ce43657451526181a33ee94fc688add3117
      TARGET_BRANCH: port/a17-frameworks-base-aosp17-base-20261103
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch pinned upstream release and verify identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir aosp-frameworks-base
          cd aosp-frameworks-base
          git init -q
          git remote add aosp https://android.googlesource.com/platform/frameworks/base
          # The full-history push previously failed with HTTP 500 in run
          # 41638866565. Fetch just the release commit and its tree.
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none \
            aosp refs/tags/android-17.0.0_r1
          actual_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          actual_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          test "$actual_sha" = "$SOURCE_SHA"
          test "$actual_tree" = "$SOURCE_TREE"
          git cat-file -e "$SOURCE_TREE^{tree}"
          echo "Verified upstream commit: $actual_sha"
          echo "Verified upstream tree: $actual_tree"
      - name: Publish exact verified release tree without history rewrite
        shell: bash
        run: |
          set -euo pipefail
          cd aosp-frameworks-base
          git remote add publish "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ref="refs/heads/$TARGET_BRANCH"
          existing="$(git ls-remote --heads publish "$ref" | cut -f1)"
          if [ -n "$existing" ]; then
            echo "Target branch already exists. Refusing overwrite: $existing"
            exit 1
          fi
          # Create a detached root with the IDENTICAL official AOSP17 tree.
          # A different commit ID is intentional: GitHub rejected the full
          # upstream history upload, so this is a release snapshot, not a
          # false claim that the original AOSP commit was imported.
          message="$(printf 'frameworks/base: verified AOSP 17.0.0_r1 source snapshot\n\nOfficial upstream commit: %s\nExact upstream tree: %s\nHistorical AOSP commit ancestry was not mirrored after GitHub HTTP 500.\nHistorical PixelExperience seventeen remains untouched.\n' "$SOURCE_SHA" "$SOURCE_TREE")"
          snapshot="$(printf '%s\n' "$message" | \
            GIT_AUTHOR_NAME='PixelExperience-Reborn CI' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='PixelExperience-Reborn CI' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$SOURCE_TREE")"
          test "$(git rev-parse "$snapshot^{tree}")" = "$SOURCE_TREE"
          echo "Publishing snapshot commit: $snapshot"
          git -c protocol.version=2 push --no-thin publish "$snapshot:$ref"
          published="$(git ls-remote --heads publish "$ref" | cut -f1)"
          test "$published" = "$snapshot"
          echo "Verified published AOSP17 snapshot ref $published, tree $SOURCE_TREE"
